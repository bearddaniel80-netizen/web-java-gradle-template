
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'example'
version = '1.0.0'
description = 'Spring Boot Web Application'

ext {
    lombokVersion = '1.18.34'
    jacksonVersion = '2.17.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web (REST APIs and embedded Tomcat)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot Actuator (health checks and monitoring)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Only needed because of @JsonProperty in the DTO
    
    implementation platform("com.fasterxml.jackson:jackson-bom:2.19.2")
    implementation "com.fasterxml.jackson.core:jackson-annotations"
    
    // Optional: Validation support
    // implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Development tools
    // developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    // testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    // testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

}

